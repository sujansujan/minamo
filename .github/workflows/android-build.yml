name: Build Minamo APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Signed Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses & Install API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Persistent Release Keystore (from GitHub Secrets)
        env:
          MINAMO_KEYSTORE_BASE64: ${{ secrets.MINAMO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MINAMO_KEYSTORE_BASE64" ]; then
            echo "$MINAMO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minamo-release.jks"
            chmod 600 "$RUNNER_TEMP/minamo-release.jks"
            echo "MINAMO_KEYSTORE_PATH=$RUNNER_TEMP/minamo-release.jks" >> "$GITHUB_ENV"
            echo "Persistent release keystore decoded for in-place APK upgrades."
          else
            echo "::notice::MINAMO_KEYSTORE_BASE64 secret not configured yet; falling back to ephemeral debug signing."
          fi

      - name: Run Android Lint & Assemble Signed APKs
        env:
          MINAMO_KEYSTORE_PASSWORD: ${{ secrets.MINAMO_KEYSTORE_PASSWORD }}
          MINAMO_KEY_ALIAS: ${{ secrets.MINAMO_KEY_ALIAS }}
          MINAMO_KEY_PASSWORD: ${{ secrets.MINAMO_KEY_PASSWORD }}
        run: gradle lintDebug assembleDebug assembleRelease --stacktrace

      - name: Clean Up Temporary Signing Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/minamo-release.jks"

      - name: Upload Signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minamo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: minamo-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
